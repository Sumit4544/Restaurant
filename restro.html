<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restorant</title>
    
    <link rel="stylesheet" href="restro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="top">
        <div class="logo"><i>Restorant</i></div>
        <div class="nav">
            <a href="#">Home</a>
            <a href="#">Menu</a>
            <a href="#">About</a>
            <a href="#">Location</a>
            <a href="#">Contact</a>
        </div>
        <div class="search">
            <i class="fa-solid fa-search"></i>
            <i class="fa-solid fa-bars"></i>
        </div>
    </div>

    <div class="heading">
        <div class="left">
            <p>Are You Hungry ?</p>
            <h1>Don't Wait!!!</h1>
            <p>Let start to order food now</p>
            <button>check out Menu</button>
        </div>
        <div class="right" id="food"></div>
        <div class="socialmedia">
            <i class="fa-brands fa-facebook-f"></i>
            <i class="fa-brands fa-twitter"></i>
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-whatsapp"></i>
        </div>
    </div>
    
    <div class="bottom">
        <div class="menu">
            <div id="food1"></div>
            <div id="food2"></div>
            <div><button onclick="showFoodList()" id="orderpage">Choose Food</button></div>
        </div>
    </div>

    <ul id="food-list">
        <li>Pizza</li>
        <li>Burger</li>
        <li>Pasta</li>
        <li>Sushi</li>
        <li>Ice Cream</li>
    </ul>




    <script src="restro.js"></script>
</body>
</html>
